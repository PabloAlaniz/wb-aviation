name: Stats

# Weekly distribution report (GitHub, Cloudflare Web Analytics, product
# events) in the run summary. See docs/analytics.md for the secrets.
on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Weekly report
        env:
          # The traffic API (views/clones) needs push access to the repo, which
          # the workflow GITHUB_TOKEN can't be granted: set STATS_GITHUB_TOKEN
          # (fine-grained PAT, this repo, "Administration: read") to get it.
          GITHUB_TOKEN: ${{ secrets.STATS_GITHUB_TOKEN || github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/stats.mjs >> "$GITHUB_STEP_SUMMARY"
