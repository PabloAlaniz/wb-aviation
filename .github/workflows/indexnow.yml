name: IndexNow

# Announce the pages of the live sitemap to IndexNow (Bing and others).
# Weekly, and by hand after a deploy that adds or changes pages.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node scripts/indexnow.mjs
