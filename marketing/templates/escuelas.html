<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <!-- font-faces -->
    <style>
      @page {
        size: A4 portrait;
        margin: 0;
      }

      :root {
        --brand: #2563eb;
        --brand-dark: #1e40af;
        --brand-soft: #dbeafe;
        --brand-tint: #eff6ff;
        --ink: #0f172a;
        --muted: #475569;
        --line: #e2e8f0;
        --warn-bg: #fffbeb;
        --warn-line: #fcd34d;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 210mm;
        height: 297mm;
        background: #ffffff;
        color: var(--ink);
        font-family: "Inter", system-ui, sans-serif;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .page {
        display: flex;
        flex-direction: column;
        width: 210mm;
        height: 297mm;
        overflow: hidden;
      }

      header {
        position: relative;
        padding: 11mm 16mm 10mm;
        background: var(--brand);
        color: #ffffff;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 3mm;
        font-size: 13pt;
        font-weight: 800;
      }

      .brand .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 10mm;
        height: 10mm;
        border-radius: 2.5mm;
        background: #ffffff;
        color: var(--brand);
        font-size: 11pt;
        font-weight: 800;
      }

      h1 {
        margin-top: 6mm;
        max-width: 140mm;
        font-size: 30pt;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }

      .lead {
        margin-top: 4mm;
        max-width: 135mm;
        font-size: 13pt;
        line-height: 1.4;
        color: var(--brand-soft);
      }

      .envelope {
        position: absolute;
        right: 16mm;
        bottom: 10mm;
        width: 34mm;
        height: 30mm;
      }

      main {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 6.5mm;
        padding: 8mm 16mm 0;
      }

      h2 {
        margin-bottom: 3mm;
        font-size: 9pt;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--brand-dark);
      }

      .problem p {
        font-size: 11pt;
        line-height: 1.5;
      }

      .steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5mm;
        list-style: none;
      }

      .steps li {
        padding: 4.5mm;
        border: 0.3mm solid var(--line);
        border-radius: 3mm;
        background: var(--brand-tint);
      }

      .steps .num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 9mm;
        height: 9mm;
        border-radius: 50%;
        background: var(--brand);
        color: #ffffff;
        font-size: 11pt;
        font-weight: 800;
      }

      .steps h3 {
        margin-top: 3mm;
        font-size: 11.5pt;
        font-weight: 700;
        line-height: 1.25;
      }

      .steps p {
        margin-top: 1.5mm;
        font-size: 9pt;
        line-height: 1.45;
        color: var(--muted);
      }

      .included {
        display: grid;
        grid-template-columns: 1fr 52mm;
        gap: 8mm;
        align-items: start;
      }

      .checklist {
        display: flex;
        flex-direction: column;
        gap: 1.6mm;
        list-style: none;
        font-size: 10pt;
        line-height: 1.4;
      }

      .checklist li {
        display: grid;
        grid-template-columns: 5mm 1fr;
      }

      .checklist li::before {
        content: "✓";
        color: var(--brand);
        font-weight: 800;
      }

      .checklist .fleet {
        display: block;
        margin-top: 0.5mm;
        font-size: 8.5pt;
        color: var(--muted);
      }

      .qr {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 5mm;
        border: 0.4mm solid var(--brand);
        border-radius: 3mm;
        text-align: center;
      }

      .qr svg {
        display: block;
        width: 40mm;
        height: 40mm;
      }

      .qr .cta {
        margin-top: 3mm;
        font-size: 11pt;
        font-weight: 700;
      }

      .qr .url {
        font-size: 12pt;
        font-weight: 800;
        color: var(--brand);
      }

      .disclaimer {
        padding: 4mm 5mm;
        border: 0.3mm solid var(--warn-line);
        border-radius: 2mm;
        background: var(--warn-bg);
        font-size: 9pt;
        line-height: 1.45;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 6mm;
        margin-top: auto;
        padding: 5mm 16mm 9mm;
        font-size: 9pt;
        color: var(--muted);
      }

      footer strong {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="brand"><span class="mark">CG</span> CheckCG</div>
        <h1>{{headline}}</h1>
        <p class="lead">{{lead}}</p>
        {{{envelopeSvg}}}
      </header>

      <main>
        <section class="problem">
          <h2>{{problemTitle}}</h2>
          <p>{{problem}}</p>
        </section>

        <section>
          <h2>{{stepsTitle}}</h2>
          <ol class="steps">
            {{{steps}}}
          </ol>
        </section>

        <section class="included">
          <div>
            <h2>{{includedTitle}}</h2>
            <ul class="checklist">
              {{{included}}}
            </ul>
          </div>
          <div class="qr">
            {{{qrSvg}}}
            <p class="cta">{{qrCta}}</p>
            <p class="url">checkcg.com</p>
          </div>
        </section>

        <p class="disclaimer">{{disclaimer}}</p>
      </main>

      <footer>
        <span><strong>checkcg.com</strong> · {{credit}}</span>
        <span>{{contact}} github.com/PabloAlaniz/wb-aviation</span>
      </footer>
    </div>
  </body>
</html>
