<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <!-- font-faces -->
    <style>
      @page {
        size: A5 portrait;
        margin: 0;
      }

      :root {
        --brand: #2563eb;
        --brand-dark: #1e40af;
        --brand-soft: #dbeafe;
        --ink: #0f172a;
        --muted: #475569;
        --line: #e2e8f0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 148mm;
        height: 210mm;
        background: #ffffff;
        color: var(--ink);
        font-family: "Inter", system-ui, sans-serif;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .page {
        display: flex;
        flex-direction: column;
        width: 148mm;
        height: 210mm;
        overflow: hidden;
      }

      header {
        position: relative;
        padding: 8mm 10mm 7mm;
        background: var(--brand);
        color: #ffffff;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 2.5mm;
        font-size: 11pt;
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .brand .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 8mm;
        height: 8mm;
        border-radius: 2mm;
        background: #ffffff;
        color: var(--brand);
        font-size: 9pt;
        font-weight: 800;
      }

      h1 {
        margin-top: 5mm;
        max-width: 98mm;
        font-size: 25pt;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }

      .lead {
        margin-top: 3.5mm;
        max-width: 92mm;
        font-size: 10.5pt;
        line-height: 1.4;
        color: var(--brand-soft);
      }

      .envelope {
        position: absolute;
        right: 9mm;
        bottom: 8mm;
        width: 30mm;
        height: 27mm;
      }

      main {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 5mm;
        padding: 6mm 10mm 0;
      }

      .benefits {
        display: flex;
        flex-direction: column;
        gap: 3.5mm;
        list-style: none;
      }

      .benefits li {
        display: grid;
        grid-template-columns: 8mm 1fr;
        gap: 3.5mm;
        align-items: start;
      }

      .benefits .num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 8mm;
        height: 8mm;
        border-radius: 50%;
        background: var(--brand-soft);
        color: var(--brand-dark);
        font-size: 10pt;
        font-weight: 800;
      }

      .benefits h2 {
        font-size: 11.5pt;
        font-weight: 700;
        line-height: 1.25;
      }

      .benefits p {
        margin-top: 0.8mm;
        font-size: 9pt;
        line-height: 1.4;
        color: var(--muted);
      }

      .bottom {
        display: grid;
        grid-template-columns: 1fr 44mm;
        gap: 6mm;
        align-items: start;
        padding-top: 5mm;
        border-top: 0.3mm solid var(--line);
      }

      .bottom h3 {
        margin-bottom: 2mm;
        font-size: 8pt;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--brand-dark);
      }

      .aircraft {
        list-style: none;
        font-size: 8.5pt;
        line-height: 1.55;
      }

      .aircraft li::before {
        content: "✓ ";
        color: var(--brand);
        font-weight: 700;
      }

      .qr {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .qr svg {
        display: block;
        width: 40mm;
        height: 40mm;
      }

      .qr .cta {
        margin-top: 2.5mm;
        font-size: 10pt;
        font-weight: 700;
      }

      .qr .url {
        font-size: 11pt;
        font-weight: 800;
        color: var(--brand);
      }

      footer {
        display: flex;
        flex-direction: column;
        gap: 1.2mm;
        padding: 4mm 10mm 8mm;
        font-size: 7.5pt;
        color: var(--muted);
      }

      footer .credit {
        font-weight: 600;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="brand"><span class="mark">CG</span> CheckCG</div>
        <h1>{{headline}}</h1>
        <p class="lead">{{lead}}</p>
        {{{envelopeSvg}}}
      </header>

      <main>
        <ol class="benefits">
          {{{benefits}}}
        </ol>

        <section class="bottom">
          <div>
            <h3>{{aircraftTitle}}</h3>
            <ul class="aircraft">
              {{{aircraftList}}}
            </ul>
          </div>
          <div class="qr">
            {{{qrSvg}}}
            <p class="cta">{{qrCta}}</p>
            <p class="url">checkcg.com</p>
          </div>
        </section>
      </main>

      <footer>
        <p class="credit">checkcg.com · {{credit}}</p>
        <p>{{disclaimer}}</p>
      </footer>
    </div>
  </body>
</html>
